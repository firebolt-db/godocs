name: AI Review Markdown Files

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai_md_review:
    name: AI Reviewer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Run AI Code Review on Markdown Files
        uses: dlidstrom/genai-code-review@v3.0.6
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_id: ${{ github.event.number }}
          openai_model: "gpt-4o-mini" # (cheaper & better than GPT-4 for now)
          openai_temperature: 0.3      # (low = focused, professional tone)
          openai_max_tokens: 2048
          mode: files
          language: en
          custom_prompt: |
custom_prompt: |
  You're a professional technical writer working on Firebolt documentation. Please review this Markdown diff with brutal honesty. Prioritize:

  1. Technical precision — flag anything inaccurate, vague, or misleading.
  2. AI readability — docs should be clear, structured, and unambiguous for LLMs.
  3. Human clarity — ensure concise, example-driven writing that follows the Google developer documentation style guide.

  Be blunt. If it’s wrong, weak, verbose, inconsistent, or confusing — call it out and suggest sharp improvements.