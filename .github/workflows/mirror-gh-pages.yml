name: Mirror GH Pages

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

jobs:
  mirror:
    name: Mirror
    if: github.repository == 'firebolt-analytics/firebolt-docs-staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: gh-pages
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        id: app-token
        with:
          app-id: ${{ secrets.FB_DB_CI_WRITER_ID }}
          private-key: ${{ secrets.FB_DB_CI_WRITER_PEM }}
          owner: firebolt-db
      - name: Prepare external mirror (README + PR template; remove dependabot)
        run: |
          cp README_external.md README.md
          cp .github/pull_request_template_external.md .github/pull_request_template.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f .github/dependabot.yml ]; then git rm -f .github/dependabot.yml; fi
          git add README.md .github/pull_request_template.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: prepare external mirror (README + PR template; remove dependabot)"
          fi
      - name: Mirror
        run: |
          git remote add public https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/firebolt-db/godocs.git
          git push public gh-pages --force
