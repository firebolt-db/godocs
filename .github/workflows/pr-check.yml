name: Check PR before merge
on:
  pull_request:
    branches:
    - '**'

jobs:
  check-basic-errors:
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
      issues: read
      # permission needed to post a comment on the PR
      pull-requests: write

    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check for merge conflict markers
        run: make check-markers

      - name: Check that /docs directory does not exist
        run: make check-legacy-dir

      - name: Check navigation consistency
        id: check-nav
        run: |
          set -xeuo pipefail
          result_file=$(mktemp)
          set +e
          make check-nav-structure > "$result_file"
          rv=$?
          set -e
          if [[ "$rv" != 0 ]]; then
            cat "$result_file"
            {
              # Abusing the unique name of the file as an EOF marker
              echo "output<<$result_file"
              cat "$result_file"
              echo "$result_file"
            } >> $GITHUB_OUTPUT
          fi
          exit "$rv"

      - name: Find Comment
        id: fc-nav
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e  # v3.1.0
        if: always()
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "Navigation Check Status:"

      - name: Post a comment on failure
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        if: failure()
        with:
          comment-id: ${{ steps.fc-nav.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            # ❌ Navigation Check Status: FAILURE
            ```
            ${{ steps.check-nav.outputs.output }}
            ```
          edit-mode: replace

      - name: Post a comment on success
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        if: success()
        with:
          comment-id: ${{ steps.fc-nav.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            # ✅ Navigation Check Status: SUCCESS
          edit-mode: replace


  check-broken-links:
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
      issues: read
      # permission needed to post a comment on the PR
      pull-requests: write

    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check there are no 404 links
        id: check-links-mint
        run: |
          set -xeuo pipefail
          result_file=$(mktemp)
          set +e
          make check-internal-links > "$result_file"
          rv=$?
          set -e
          if [[ "$rv" != 0 ]]; then
            cat "$result_file"
            {
              # Abusing the unique name of the file as an EOF marker
              echo "output<<$result_file"
              cat "$result_file"
              echo "$result_file"
            } >> $GITHUB_OUTPUT
          fi
          exit "$rv"

      - name: Find Comment
        id: fc-links-mint
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e  # v3.1.0
        if: always()
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "Link Check Status (internal):"

      - name: Post a comment on failure
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        if: failure()
        with:
          comment-id: ${{ steps.fc-links-mint.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            # ❌ Link Check Status (internal): FAILURE
            ```
            ${{ steps.check-links-mint.outputs.output }}
            ```
          edit-mode: replace

      - name: Post a comment on success
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        if: success()
        with:
          comment-id: ${{ steps.fc-links-mint.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            # ✅ Link Check Status (internal): SUCCESS
          edit-mode: replace


  check-links-using-crawler:
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
      issues: read
      # permission needed to post a comment on the PR
      pull-requests: write

    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check there are no 404 links
        id: check-links-crawler
        run: |
          set -xeuo pipefail
          result_file=$(mktemp)
          set +e
          make check-links-using-crawler > "$result_file"
          rv=$?
          set -e
          if [[ "$rv" != 0 ]]; then
            cat "$result_file"
            {
              # Abusing the unique name of the file as an EOF marker
              echo "output<<$result_file"
              cat "$result_file"
              echo "$result_file"
            } >> $GITHUB_OUTPUT
          fi
          exit "$rv"

      - name: Find Comment
        id: fc-links-crawler
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e  # v3.1.0
        if: always()
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "Link Check Status (crawler):"

      - name: Post a comment on failure
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        if: failure()
        with:
          comment-id: ${{ steps.fc-links-crawler.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            # ❌ Link Check Status (crawler): FAILURE (informational check, does not block merge)
            ```
            ${{ steps.check-links-crawler.outputs.output }}
            ```
          edit-mode: replace

      - name: Post a comment on success
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        if: success()
        with:
          comment-id: ${{ steps.fc-links-crawler.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            # ✅ Link Check Status (crawler): SUCCESS
          edit-mode: replace

  check-sql-examples:
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
      issues: read
      # permission needed to post a comment on the PR
      pull-requests: write

    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check SQL examples
        id: check-sql
        run: |
          set -xeuo pipefail
          result_file=$(mktemp)
          set +e
          make check-sql > "$result_file"
          rv=$?
          set -e
          if [[ "$rv" != 0 ]]; then
            echo "result=$rv" >> $GITHUB_OUTPUT
            cat "$result_file"
            {
              # Abusing the unique name of the file as an EOF marker
              echo "output<<$result_file"
              cat "$result_file"
              echo "$result_file"
            } >> $GITHUB_OUTPUT
          fi

      - name: Find Comment
        id: fc-sql
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e  # v3.1.0
        if: always()
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "SQL Example Check Status:"

      - name: Post a comment on failure
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        if: steps.check-sql.outputs.result != 0
        with:
          comment-id: ${{ steps.fc-sql.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            # ❌ SQL Example Check Status: FAILURE (informational check, does not block merge)
            ```
            ${{ steps.check-sql.outputs.output }}
            ```
          edit-mode: replace

      - name: Post a comment on success
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        if: steps.check-sql.outputs.result == 0
        with:
          comment-id: ${{ steps.fc-sql.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            # ✅ SQL Example Check Status: SUCCESS
          edit-mode: replace
